<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Imagen completa</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      display: flex;
      justify-content: center;   /* Centra horizontalmente */
      align-items: center;       /* Centra verticalmente */
      background-color: #000;    /* Fondo negro opcional */
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;       /* Ajusta la imagen sin recortes */
    }
  </style>
</head>
<body>
  <img src="imagen.jpg" alt="Mi imagen">
</body>
</html>
