<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi página con una imagen</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }
    img {
      max-width: 90%;
      max-height: 90%;
      border: 5px solid #333;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <img src="imagen.jpg" alt="Mi imagen">
</body>
</html>
